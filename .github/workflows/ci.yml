name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools
        run: |
          uv venv
          uv pip install ".[mcp]" pytest pytest-asyncio ruff
      - name: Lint and test installed package
        run: |
          uv run --no-project ruff check src tests scripts
          uv run --no-project python scripts/check_release.py
          uv run --no-project pytest
          uv run --no-project python scripts/smoke.py
