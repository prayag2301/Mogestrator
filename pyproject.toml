# Packaging skeleton for the `mog` CLI (package: mogestrator).
#
# M1 (in progress): the index/inspect CLI is implemented; retrieval is M2.
# 0.1.1 is the first functional release; 0.0.1 reserved the package name.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mogestrator"
version = "0.1.1"
description = "An offline code knowledge graph with incremental indexing, content anchors, and drift detection for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "prayag2301" }]
keywords = ["ai", "agents", "mcp", "claude", "context", "knowledge-graph", "rag", "code-search", "prompt-injection"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing :: Indexing",
]

# Base install must work offline (ADR-0005). fastembed is deliberately NOT here
# yet: embeddings land in M2 (Q1 open), and it pulls ~300MB of ONNX runtime.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.25",
  "sqlite-vec>=0.1.6",             # optional at runtime: probed, degrades to FTS
  "platformdirs>=4.2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
gateway = ["fastapi>=0.115", "uvicorn>=0.30", "cryptography>=43.0"]
api-embeddings = ["anthropic>=0.40", "openai>=1.40"]
all = ["mogestrator[mcp,gateway,api-embeddings]"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyinstaller>=6.10",
]

[project.scripts]
mog = "mog.cli.main:app"

[project.urls]
Homepage = "https://github.com/prayag2301/Orchestration"
Documentation = "https://github.com/prayag2301/Orchestration/tree/main/docs"
Issues = "https://github.com/prayag2301/Orchestration/issues"

# Third-party adapters register here (ARCHITECTURE §3).
[project.entry-points."mog.parsers"]
[project.entry-points."mog.embedders"]
[project.entry-points."mog.retrievers"]
[project.entry-points."mog.policies"]

[tool.hatch.build.targets.wheel]
packages = ["src/mog"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
